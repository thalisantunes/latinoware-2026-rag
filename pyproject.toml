[project]
name = "latinoware-2026-rag"
version = "0.1.0"
description = "RAG sobre as palestras e palestrantes da Latinoware 2026 (Weaviate + Ollama + faster-whisper)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "yt-dlp[default]==2026.8.19",
    "faster-whisper==1.2.1",
    "av==15.1.0",  # o av 16+ removeu um parâmetro usado pelo faster-whisper 1.2.1
    "weaviate-client==4.23.1",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
