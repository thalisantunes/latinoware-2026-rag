<style>
  :root {
    --bg: #f7f6f1; --surface: #ffffff; --surface-2: #efede5; --fg: #1b1c19; --muted: #5d5e57;
    --line: #dcd9ce; --line-ui: #7d7a70; --accent: #17694a; --accent-fg: #ffffff; --accent-soft: #dcefe5;
    --danger: #a8321f; --danger-soft: #fbe6e1; --focus: #1d5fd1;
    --radius: 12px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .04);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121412; --surface: #1b1e1b; --surface-2: #242824; --fg: #ebebe5; --muted: #a4a69d;
      --line: #333833; --line-ui: #7a7f77; --accent: #5cc595; --accent-fg: #0d1f16; --accent-soft: #1d3329;
      --danger: #ff8a73; --danger-soft: #3a1f1a; --focus: #8ab4ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--sans); }
  a { color: var(--accent); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  /* tela larga: a programação usa até 1400 px; pergunta e resposta ficam numa coluna de leitura de 900 px */
  @media (min-width: 1100px) {
    .wrap { max-width: 1400px; padding: 0 32px; }
    .wrap > header, main > :not(#catalogo), .wrap > footer { max-width: 900px; margin-left: auto; margin-right: auto; }
    .resposta { max-width: 75ch; }
    main > .ir { display: block; } /* inline-block não respeita a coluna de 900 px */
  }
  @media (min-width: 1800px) { .wrap { max-width: 1760px; } }

  header { padding: 28px 0 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .marca { font: 500 .8rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; margin: 18px 0 8px; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; max-width: 60ch; }

  .langs { display: inline-flex; border: 1px solid var(--line-ui); border-radius: 999px; padding: 3px; background: var(--surface); }
  .langs button { border: 0; background: transparent; color: var(--muted); font: 600 .85rem/1 var(--sans);
    padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

  form { margin-top: 24px; background: var(--surface); border: 1px solid var(--line-ui); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px; }
  form:focus-within { border-color: var(--accent); outline: 2px solid var(--focus); outline-offset: 2px; }
  textarea { display: block; width: 100%; min-height: 96px; border: 0; background: transparent; color: inherit;
    font: inherit; resize: vertical; padding: 4px; }
  textarea:focus-visible { outline: none; }
  textarea::placeholder { color: var(--muted); opacity: 1; }
  .acoes { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .dica { color: var(--muted); font-size: .85rem; }
  .enviar { border: 0; background: var(--accent); color: var(--accent-fg); font: 600 1rem/1 var(--sans);
    padding: 12px 20px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .enviar[aria-disabled="true"] { opacity: .6; cursor: progress; }

  .exemplos-rotulo { display: block; margin: 20px 0 8px; }
  .exemplos { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .exemplos button { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    font: 400 .9rem/1.3 var(--sans); padding: 8px 14px; border-radius: 999px; cursor: pointer; text-align: left; min-height: 44px; }
  .exemplos button:hover { border-color: var(--accent); }

  #saida { margin-top: 32px; }
  #saida:focus { outline: none; }
  .estado { border-radius: var(--radius); padding: 16px; }
  .estado p { margin: 0; }
  .erro { background: var(--danger-soft); color: var(--danger); }
  .erro button { margin-top: 8px; border: 1px solid currentColor; background: transparent; color: inherit;
    font: 600 .9rem/1 var(--sans); padding: 8px 14px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .vazio { background: var(--surface-2); color: var(--muted); }
  .etapas { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 10px; color: var(--muted); }
  .etapas li { display: flex; gap: 10px; align-items: baseline; }
  .etapas li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-ui);
    transform: translateY(1px); }
  .etapas .atual { color: var(--fg); }
  .etapas .atual::before { border-color: var(--accent); background: var(--accent); animation: pulsa 1.2s ease-in-out infinite; }
  .etapas .feito::before { border-color: var(--accent); background: var(--accent-soft); }
  @keyframes pulsa { 50% { opacity: .3; transform: translateY(1px) scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .etapas .atual::before { animation: none; } }

  .resposta { font-size: 1.05rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .resposta a.cit { font: 500 .8em/1 var(--mono); padding: 4px 6px; border-radius: 4px;
    background: var(--accent-soft); vertical-align: 1px; }
  h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  .fontes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .fonte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .titulo { font-weight: 600; overflow-wrap: anywhere; display: block; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .88rem; color: var(--muted); align-items: center; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .chip { font: 500 .85rem/1 var(--sans); border: 1px solid var(--line-ui); border-radius: 999px; padding: 8px 12px;
    min-height: 36px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; scroll-margin-top: 16px; }
  .chip b { font: 500 .8rem/1 var(--mono); color: var(--muted); }
  .chip:target { border-color: var(--accent); background: var(--accent-soft); }
  .chip.video { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .chip.video b { color: inherit; }
  .sem { font-size: .85rem; color: var(--muted); }
  .partilha { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .partilha button { border: 1px solid var(--line-ui); background: var(--surface); color: var(--fg); font: 600 .9rem/1 var(--sans);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .reaproveitada { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .reaproveitada button { border: 1px solid var(--line-ui); background: var(--surface); color: var(--fg); font: 600 .85rem/1 var(--sans);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; min-height: 44px; }
  .ir { display: inline-block; margin-top: 16px; font-size: .95rem; }
  section.bloco { margin-top: 48px; scroll-margin-top: 16px; }
  section.bloco > h2 { font-size: 1.3rem; letter-spacing: 0; text-transform: none; color: var(--fg); margin: 0 0 16px; font-weight: 700; }

  footer { margin: 56px 0 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
  footer p { margin: 0 0 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

<div class="wrap">
  <header>
    <div class="top">
      <span class="marca">Latinoware 2026 · RAG</span>
      <div class="langs" role="group" id="langs" aria-label="Idioma">

        <button type="button" data-l="pt" lang="pt" aria-label="PT, Português">PT</button>
        <button type="button" data-l="en" lang="en" aria-label="EN, English">EN</button>
        <button type="button" data-l="es" lang="es" aria-label="ES, Español">ES</button>
      </div>
    </div>
    <h1 id="h1">Pergunte sobre a Latinoware 2026</h1>
    <p class="sub" id="sub"></p>

  <main>
    <noscript><p>Esta página precisa de JavaScript. · This page needs JavaScript. · Esta página necesita JavaScript.</p></noscript>
    <form id="f">
      <label for="q" class="sr" id="lq"></label>
      <textarea id="q" required minlength="3" maxlength="1000" aria-describedby="dica"></textarea>
      <div class="acoes">

    <span class="dica exemplos-rotulo" id="lex"></span>
    <ul class="exemplos" id="exemplos" aria-labelledby="lex"></ul>
    <div id="faq" hidden><span class="dica exemplos-rotulo" id="lfaq"></span>
      <ul class="exemplos" id="frequentes" aria-labelledby="lfaq"></ul></div>
    <a class="ir" href="#catalogo" id="ir"></a>
    <p class="estado vazio" id="fora" role="status" hidden></p>
    <p class="sr" id="anuncio" role="status"></p>
    <section id="saida" tabindex="-1"></section>
    <section class="bloco" id="catalogo" aria-labelledby="hcat">
      <h2 id="hcat"></h2>
      <latinoware-catalogo src="./catalogo.json" fotos="./fotos.json" perguntar></latinoware-catalogo>
    </section>
    <section class="bloco" id="sobre" aria-labelledby="hsobre">
      <h2 id="hsobre"></h2>
      <p id="sobretxt"></p>
      <p id="privtxt"></p>
      <p id="privperg"></p>
    </section>
  </main>

  <footer>
    <p id="aviso"></p>
    <p><span id="dados"></span> <a href="https://latinoware.org">latinoware.org</a> ·
      <a href="https://github.com/thalisantunes/latinoware-2026-rag" id="repo"></a></p>
  </footer>
</div>

<script>

      dados: "Dados públicos de", repo: "Código no GitHub",
      ex: ["Quem falou sobre Home Assistant?", "Quais palestras trataram de segurança?", "O que o maddog apresentou?", "Teve palestra sobre IA na educação?"],
    },
    en: {
      html: "en", h1: "Ask about Latinoware 2026",
      sub: "Talks and speakers of the free software conference in Foz do Iguaçu, Brazil, October 14–16, 2026. Answers in English, Spanish or Portuguese.",
      lq: "Your question", ph: "E.g.: Who talked about Home Assistant?", dica: "Ctrl/⌘+Enter to send",

      fontes: "Sources", fonte: "Source", pronto: "Answer ready.",

      video: "Watch from", estimado: "estimated time",

    },
    es: {

      sub: "Charlas y ponentes del congreso de software libre en Foz do Iguaçu, Brasil, del 14 al 16 de octubre de 2026. Responde en español, inglés o portugués.",

      privPerg: ["Las preguntas se guardan sin IP ni identificación durante 90 días, para reutilizar respuestas y mejorar el proyecto. Detalles en ", "Privacidad", "."],
      etapa: { reaproveitando: () => "Reutilizando la respuesta de una pregunta igual…",

      ex: ["¿Quién habló de Home Assistant?", "¿Qué charlas hubo sobre seguridad?", "¿Qué presentó maddog?", "¿Hubo charlas sobre IA en la educación?"],
    },

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...filhos) => { const e = Object.assign(document.createElement(tag), props); e.append(...filhos); return e; };
  const tem = (k) => typeof k === "string" && Object.hasOwn(T, k);
  const navegador = (navigator.language || "pt").slice(0, 2);
  let escolha = "auto";
  try { escolha = localStorage.getItem("idioma") || "auto"; } catch {}
  if (escolha !== "auto" && !tem(escolha)) escolha = "auto";
  let ocupado = false;

  const lingua = () => escolha !== "auto" ? escolha : (tem(navegador) ? navegador : "pt");
  const ui = () => T[lingua()];
  const seguro = (url) => typeof url === "string" && url.startsWith("https://");
  const hms = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  };

  function aplicar() {
    const t = ui();

    $("lfaq").textContent = t.lfaq;
    $("fora").textContent = t.rede;
    frequentes();
    const [p1, email, p2, pagina, p3] = t.priv;
    $("privtxt").replaceChildren(p1, el("a", { href: `mailto:${email}`, textContent: email }), p2,
      link(pagina, "https://ilove.the.br/privacidade/"), p3);
    document.querySelector("latinoware-catalogo").setAttribute("lang", lingua());
    $("q").placeholder = t.ph;
    $("b").textContent = ocupado ? t.enviando : t.enviar;
    $("auto").textContent = `Auto (${lingua().toUpperCase()})`;
    $("langs").setAttribute("aria-label", t.langs);
    for (const b of $("langs").children) b.setAttribute("aria-pressed", b.dataset.l === escolha);
    $("exemplos").replaceChildren(...t.ex.map((x) => el("li", {}, el("button", {
      type: "button", textContent: x, onclick: () => { if (ocupado) return; $("q").value = x; perguntar(x); } }))));
  }

  function link(texto, url) {
    return seguro(url) ? el("a", { href: url, target: "_blank", rel: "noopener", textContent: texto }) : el("span", { textContent: texto });
  }

  // troca [n] e [n, m] da resposta por links para as fontes, sem interpretar HTML
  function comCitacoes(texto, numeros, t) {
    const p = el("div", { className: "resposta" });
    for (const parte of texto.split(/(\[\d+(?:\s*[,;]\s*\d+)*\])/)) {
      const ns = /^\[[\d,;\s]+\]$/.test(parte) ? parte.match(/\d+/g).map(Number) : [];
      if (!ns.length || !ns.every((n) => numeros.has(n))) { p.append(parte); continue; }
      ns.forEach((n, i) => p.append(i ? " " : "", el("a", {
        className: "cit", href: `#fonte-${n}`, textContent: n, ariaLabel: `${t.fonte} ${n}` })));
    }
    return p;
  }

  const normal = (s) => (s || "").normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  const limpo = (s) => (s || "").replace(/^['"“”‘’.\s]+|['"“”‘’\s]+$/g, "");
  const chaveFonte = (f) => f.fonte === "bio" ? `bio|${f.url}` : `${normal(f.titulo)}|${f.inicio}`;
  // vídeo da palestra pelo catálogo: o resumo de uma keynote pode ser de uma sala sem transmissão
  let videos = null;
  const catalogo = fetch("./catalogo.json", { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((c) => {
    videos = new Map(c.palestras.filter((p) => p.url_video).map((p) => [`${normal(p.titulo)}|${p.data}T${p.hora_inicio}`, p]));
  }).catch(() => {}); // sem catálogo: sem fallback e sem "Sem gravação" (não dá para saber)

  // uma entrada por palestra; cada fonte vira um chip [n] com id="fonte-n" (alvo das citações)
  function palestra(grupo, t) {
    const f0 = grupo.find((f) => f.fonte === "resumo") || grupo[0];
    const meta = el("div", { className: "meta" });
    const pessoas = Array.isArray(f0.links_palestrantes) ? f0.links_palestrantes.filter((p) => p && p.nome) : [];
    if (f0.fonte !== "bio" && pessoas.length) {
      const span = el("span");
      pessoas.forEach((p, i) => span.append(i ? ", " : "", link(p.nome, p.url)));
      meta.append(span);
    }
    if (f0.espaco) meta.append(el("span", { textContent: f0.espaco }));
    const nome = f0.fonte === "bio" ? f0.palestrantes
      : f0.fonte === "transcricao" && !f0.palestra_id ? t.semPalestra(f0.espaco, `${(f0.inicio || "").slice(8, 10)}/${(f0.inicio || "").slice(5, 7)}`)
      : limpo(f0.titulo) || f0.palestrantes;
    const chips = el("div", { className: "chips" });
    for (const f of grupo) {
      const video = f.fonte === "transcricao" && seguro(f.url_video) && Number.isInteger(f.video_t);
      const a = link("", video ? f.url_video : f.url);
      a.className = "chip"; a.id = `fonte-${f.n}`;
      a.replaceChildren(el("b", { textContent: `[${f.n}]` }), video ? `▶ ${t.tipo.transcricao} ${hms(f.video_t)}` : t.tipo[f.fonte] || f.fonte);
      chips.append(a);
      if (video && f.alinhamento === "estimado") chips.append(el("span", { className: "sem", textContent: `(${t.estimado})` }));
    }
    const p = f0.fonte !== "bio" && videos?.get(`${normal(f0.titulo)}|${(f0.inicio || "").slice(0, 16)}`);
    const comVideo = grupo.find((f) => f.fonte !== "transcricao" && seguro(f.url_video) && Number.isInteger(f.video_t))
      || (p && { url_video: p.url_video, video_t: p.t_inicio });
    if (comVideo) {
      const a = link(`▶ ${t.assistir} (${hms(comVideo.video_t)})`, comVideo.url_video);
      a.className = "chip video";
      chips.append(a);
    } else if (f0.fonte === "resumo" && !grupo.some((f) => seguro(f.url_video)) && videos) {
      chips.append(el("span", { className: "sem", textContent: t.semGravacao }));
    }
    return el("li", { className: "fonte" }, el("span", { className: "titulo", textContent: nome }), meta, chips);
  }

  function agrupar(fontes) {
    const grupos = new Map();
    for (const f of fontes) (grupos.get(chaveFonte(f)) || grupos.set(chaveFonte(f), []).get(chaveFonte(f))).push(f);
    return [...grupos.values()];
  }

  function mostrar(anuncio, ...nos) { $("anuncio").textContent = anuncio; $("saida").replaceChildren(...nos); }

  // etapas conhecidas pelo /health: com reranker há "reordenando" entre a busca e a escrita
  // a GPU é doméstica: sem API, o aviso aparece e a programação (estática) segue funcionando
  let servidor = { modelo: "", reranker: null }, fora = false;
  function saude() {
    fetch(API_URL + "/health", { signal: AbortSignal.timeout(10000) }).then((r) => r.json())
      .then((d) => { servidor = d; fora = !d.ok; }).catch(() => { fora = true; })
      .finally(() => { $("fora").textContent = ui().rede; $("fora").hidden = !fora; });
  }
  saude();
  setInterval(saude, 60000);

  // eventos de /ask/stream: blocos "event: x\ndata: {json}" separados por linha em branco
  async function* sse(r) {
    const leitor = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    try {
      for (;;) {
        const { value, done } = await leitor.read();
        if (done) return;
        buf += value.replace(/\r\n/g, "\n");
        for (let i; (i = buf.indexOf("\n\n")) >= 0; buf = buf.slice(i + 2)) {
          const bloco = buf.slice(0, i), ev = /^event: (.*)$/m.exec(bloco)?.[1], dados = /^data: (.*)$/m.exec(bloco)?.[1];
          if (ev && dados) yield [ev, JSON.parse(dados)];
        }
      }
    } finally {
      leitor.cancel().catch(() => {});  // break/erro no meio: fecha a conexão e libera a GPU no servidor
    }
  }

  // resposta e fontes em texto puro, para colar em qualquer lugar
  function textoPuro(pergunta, d, fontes, t) {
    const linhas = fontes.map((f) => `[${f.n}] ${f.fonte === "transcricao" && !f.palestra_id ? f.espaco : limpo(f.titulo)}`
      + `${f.palestrantes && f.fonte !== "bio" ? ` (${f.palestrantes})` : ""} ${f.url_video || f.url}`);
    return `${t.pergunta}: ${pergunta}\n\n${d.resposta}\n\n${t.fontes}:\n${linhas.join("\n")}`;
  }

  function partilha(pergunta, d, fontes, t) {
    const avisar = (msg) => { $("anuncio").textContent = ""; setTimeout(() => { $("anuncio").textContent = msg; }, 50); };
    // fora de https não existe navigator.clipboard: o erro vira aviso, não exceção solta
    const copiar = (texto, ok) => Promise.resolve().then(() => navigator.clipboard.writeText(texto))
      .then(() => avisar(ok), () => avisar(t.naoCopiou));
    const link = `${location.origin}${location.pathname}?pergunta=${encodeURIComponent(pergunta)}`;
    return el("div", { className: "partilha" },
      el("button", { type: "button", textContent: t.copiar, onclick: () => copiar(textoPuro(pergunta, d, fontes, t), t.copiado) }),
      el("button", { type: "button", textContent: t.compartilhar, onclick: () => {
        if (navigator.share) navigator.share({ title: document.title, text: pergunta, url: link })
          .catch((e) => { if (e.name !== "AbortError") copiar(link, t.linkCopiado); });
        else copiar(link, t.linkCopiado);
      } }));
  }

  function listaFontes(fontes, t) {
    return [el("h2", { textContent: t.fontes }), el("ul", { className: "fontes" }, ...agrupar(fontes).map((g) => palestra(g, t)))];
  }

  // perguntas feitas mais de uma vez (a API só devolve essas), na língua da interface
  function frequentes() {
    const lingua_ = lingua();
    fetch(`${API_URL}/frequentes?idioma=${lingua_}`, { signal: AbortSignal.timeout(10000) }).then((r) => r.ok ? r.json() : [])
      .then((lista) => {
        if (lingua_ !== lingua()) return;  // trocou de língua no meio
        $("frequentes").replaceChildren(...lista.map((f) => el("li", {}, el("button", {
          type: "button", textContent: f.pergunta, onclick: () => { if (ocupado) return; $("q").value = f.pergunta; perguntar(f.pergunta); } }))));
        $("faq").hidden = !lista.length;
      }).catch(() => { $("faq").hidden = true; });
  }

  async function perguntar(pergunta, palestraId, novo) {
    if (ocupado) return;
    if (pergunta.length < 3) { $("q").focus(); return; }
    const t = ui();
    ocupado = true;
    $("b").setAttribute("aria-disabled", "true"); $("b").textContent = t.enviando;
    history.replaceState(null, "", location.pathname + location.search);  // tira o #fonte-n da resposta anterior
    const nomes = servidor.reranker ? ["buscando", "reordenando", "escrevendo"] : ["buscando", "escrevendo"];
    const etapas = el("ol", { className: "etapas" }, ...nomes.map((n) => el("li", { textContent: t.etapa[n](servidor.modelo) })));
    const etapa = (nome, modelo) => {
      const atual = nomes.indexOf(nome);
      [...etapas.children].forEach((li, i) => { li.className = i < atual ? "feito" : i === atual ? "atual" : ""; });
      if (atual >= 0) etapas.children[atual].textContent = t.etapa[nome](modelo || servidor.modelo);
      $("anuncio").textContent = t.etapa[nome]?.(modelo || servidor.modelo) || "";
    };
    const texto = el("div", { className: "resposta" }), caixaFontes = el("div");
    const bloco = el("div", { lang: t.html }, etapas, texto, caixaFontes);
    mostrar("", bloco);
    etapa("buscando");
    let status, fontes = [];
    const corpo = { pergunta };
    if (escolha !== "auto") corpo.idioma = escolha;
    if (palestraId) corpo.palestra_id = palestraId;  // "Resumo com IA": só os trechos dessa palestra
    if (novo) corpo.novo = true;  // "Gerar de novo": ignora a resposta guardada
    const pedir = (rota) => fetch(API_URL + rota, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo), signal: AbortSignal.timeout(90000) });
    try {
      let r = await pedir("/ask/stream");
      let d = null;
      if (r.status === 404 || r.status === 405) {  // API antiga, sem streaming
        r = await pedir("/ask");
        status = r.status;
        if (!r.ok) throw new Error(status);
        d = await r.json();
        fontes = Array.isArray(d?.fontes) ? d.fontes : [];
      } else {
        status = r.status;
        if (!r.ok) throw new Error(status);
        for await (const [ev, x] of sse(r)) {
          if (ev === "etapa") etapa(x.etapa, x.modelo);
          else if (ev === "fontes") {
            fontes = Array.isArray(x.fontes) ? x.fontes.filter((f) => f && Number.isInteger(f.n)) : [];
            if (!fontes.length) break;
            await catalogo;
            const tl = tem(x.idioma) ? T[x.idioma] : t;
            bloco.lang = tl.html;
            caixaFontes.replaceChildren(...listaFontes(fontes, tl));
          } else if (ev === "token") texto.append(x.t);
          else if (ev === "fim") d = x;
          else if (ev === "erro") { status = x.status; throw new Error(status); }
        }
        if (!d && fontes.length) { status = undefined; throw new Error("rede"); }  // conexão caiu antes do fim
      }
      fontes = fontes.filter((f) => f && Number.isInteger(f.n));
      if (!fontes.length || typeof d?.resposta !== "string") { mostrar(t.vazio, el("div", { className: "estado vazio", textContent: t.vazio })); return; }
      await catalogo;
      const tl = tem(d.idioma) ? T[d.idioma] : t;
      mostrar(tl.pronto, el("div", { lang: tl.html },
        comCitacoes(d.resposta, new Set(fontes.map((f) => f.n)), tl),
        ...(d.reaproveitada ? [el("p", { className: "reaproveitada" },
          tl.reaproveitada(new Date(d.criado_em).toLocaleDateString(tl.html)),
          el("button", { type: "button", textContent: tl.gerarNovo, onclick: () => perguntar(pergunta, palestraId, true) }))] : []),
        partilha(pergunta, d, fontes, tl), ...listaFontes(fontes, tl)));
      $("saida").focus();
    } catch (err) {
      if (status === 404) { mostrar(t.vazio, el("div", { className: "estado vazio", textContent: t.vazio })); return; }  // palestra sem trechos
      const msg = err.name === "TimeoutError" ? t.demora : !status ? t.rede : status === 429 ? t.ocupado
        : `${t.erro} (${status})`;
      mostrar(msg, el("div", { className: "estado erro" }, el("p", { textContent: msg }),
        el("button", { type: "button", textContent: t.tentar, onclick: () => perguntar(pergunta, palestraId) })));
    } finally {
      ocupado = false;
      $("b").removeAttribute("aria-disabled"); $("b").textContent = ui().enviar;
    }
  }


  $("f").addEventListener("submit", (e) => { e.preventDefault(); perguntar($("q").value.trim()); });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); perguntar($("q").value.trim()); }
  });
  $("langs").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    escolha = b.dataset.l;
    try { localStorage.setItem("idioma", escolha); } catch {}
    aplicar();
  });
  document.addEventListener("perguntar", (e) => {
    e.preventDefault();
    if (ocupado) return; // não troca o texto de uma pergunta em andamento
    $("q").value = e.detail.pergunta;
    $("f").scrollIntoView({ block: "start" });
    perguntar(e.detail.pergunta, e.detail.palestra_id);
  });
  aplicar();
  try { const p = new URLSearchParams(location.search).get("pergunta"); if (p) $("q").value = p.slice(0, 1000); } catch {}
</script>
</body>
